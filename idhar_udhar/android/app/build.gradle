plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.idharudhar.idhar_udhar"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // Customer + Rider as separate Play Store apps.
    flavorDimensions "app"
    productFlavors {
        customer {
            dimension "app"
            // Preserve existing Customer applicationId (Play identity).
            applicationId "com.idharudhar.idhar_udhar"
            resValue "string", "app_name", "IDHAR UDHAR"
        }
        rider {
            dimension "app"
            applicationId "com.idharudhar.rider"
            resValue "string", "app_name", "IDHAR UDHAR PARTNER"
        }
    }

    defaultConfig {
        applicationId "com.idharudhar.idhar_udhar"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Debug signing for local release runs until store keys are configured.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
