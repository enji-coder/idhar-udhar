plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def isReleaseBuild = gradle.startParameter.taskNames.any { String name ->
    name.toLowerCase().contains('release')
}
if (isReleaseBuild) {
    def storeFileValue = keystoreProperties['storeFile']
    def missingReleaseSigning = !keystorePropertiesFile.exists() ||
        storeFileValue == null || storeFileValue.toString().trim().isEmpty() ||
        keystoreProperties['storePassword'] == null ||
        keystoreProperties['keyPassword'] == null ||
        keystoreProperties['keyAlias'] == null
    if (missingReleaseSigning) {
        throw new GradleException(
            'Release signing requires android/key.properties with storePassword, keyPassword, keyAlias, and storeFile. Release does not use the debug keystore.'
        )
    }
}

android {
    namespace "com.idharudhar.idhar_udhar"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // Customer + Rider as separate Play Store apps.
    flavorDimensions "app"
    productFlavors {
        customer {
            dimension "app"
            // Preserve existing Customer applicationId (Play identity).
            applicationId "com.idharudhar.idhar_udhar"
            resValue "string", "app_name", "IDHAR UDHAR"
            // Customer-restricted key. Set MAPS_API_KEY_CUSTOMER in local.properties.
            manifestPlaceholders += [mapsApiKey: (localProperties.getProperty("MAPS_API_KEY_CUSTOMER") ?: "")]
        }
        rider {
            dimension "app"
            applicationId "com.idharudhar.rider"
            resValue "string", "app_name", "IDHAR UDHAR PARTNER"
            // Rider must use a key restricted to com.idharudhar.rider. Set in local.properties.
            manifestPlaceholders += [mapsApiKey: (localProperties.getProperty("MAPS_API_KEY_RIDER") ?: "")]
        }
    }

    defaultConfig {
        applicationId "com.idharudhar.idhar_udhar"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders += [mapsApiKey: ""]
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

// Flutter CLI always passes -Ptarget=lib/main.dart unless -t is set.
// That property wins over flutter { target }, so Rider compile tasks must
// be pointed at rider_main.dart after configuration, immediately before run.
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        if (task.name.startsWith("compileFlutterBuildRider")) {
            task.targetPath = "lib/rider/rider_main.dart"
        }
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-location:21.3.0"
}
