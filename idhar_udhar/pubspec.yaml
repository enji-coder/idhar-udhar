name: idhar_udhar
description: IDHAR UDHAR — production logistics platform connecting customers with delivery riders.
publish_to: "none"

version: 1.0.0+4

environment:
  sdk: ">=3.2.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management & navigation
  flutter_riverpod: ^2.4.10
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.0

  # Models & serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  uuid: ^4.3.3
  collection: ^1.18.0

  # UI & media
  # 6.3.0+ makes FontWeight-keyed maps non-const (required for Dart 3.12+)
  google_fonts: ^6.3.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  lottie: ^3.0.0
  flutter_animate: ^4.3.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Device & platform
  connectivity_plus: ^5.0.2
  permission_handler: ^11.2.0
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.19.0
  logger: ^2.0.2+1
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

# Launcher icons — official logo centered on PURE WHITE background.
flutter_launcher_icons:
  android: "ic_launcher_idhar"
  ios: false
  image_path: assets/customer/logos/idhar_udhar_app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/customer/logos/idhar_udhar_app_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/customer/logos/
    - assets/customer/icons/
    - assets/customer/illustrations/
    - assets/customer/illustrations/splash/
    - assets/customer/illustrations/login/
    - assets/customer/images/
    - assets/customer/images/3d/
    - assets/customer/lottie/
    - assets/customer/fonts/
    - assets/customer/animations/
    - assets/rider/logos/
    - assets/rider/images/
    - assets/rider/images/onboarding/
    - assets/rider/images/profile/
    - assets/rider/images/vehicle/
    - assets/rider/images/documents/
    - assets/rider/images/orders/
    - assets/rider/images/navigation/
    - assets/rider/images/payment/
    - assets/rider/images/safety/
    - assets/rider/images/dashboard/

  # Uncomment when Poppins TTF files are added under assets/fonts/
  # (paths match AssetPaths.fontPoppins*). Until then, google_fonts is used.
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
